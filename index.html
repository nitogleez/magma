<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magma">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Magma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#0e0e10; --s1:#18181b; --s2:#222226; --line:#2c2c31; --text:#f5f5f2; --mut:#a3a3a8; --dim:#6c6c73;
  --c:#ff6b1a; --c-ink:#141414; --bad:#ff4d5e; --warm:#ffcf3a; --drop:#9b7bff;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);min-height:100vh;padding-bottom:calc(var(--nav) + 28px + env(safe-area-inset-bottom));overflow-x:hidden}
body.has-timer{padding-bottom:calc(var(--nav) + 110px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.bg{display:none}

header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font:800 italic 26px/1 var(--display);letter-spacing:.5px;text-transform:uppercase;margin-right:auto;color:var(--text)}
.brand::after{content:"";display:inline-block;width:8px;height:8px;background:var(--c);margin-left:3px;transform:skewX(-12deg)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;flex:none;color:var(--text)}
.icon-btn svg{width:19px;height:19px}
.avatar{width:40px;height:40px;border-radius:10px;border:0;background:var(--c);color:var(--c-ink);font:800 italic 20px var(--display);display:grid;place-items:center;flex:none}
main{max-width:760px;margin:0 auto;padding:0 16px 16px}

nav{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:#0a0a0b;border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.6px;position:relative}
nav svg{width:22px;height:22px}
nav button.on{color:var(--text)}
nav button.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--c)}
nav .dot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--c)}

.glass{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.pad{padding:16px}
.stack>*+*{margin-top:12px}
h1{font:800 italic 34px/1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.2px}
h2{font:800 italic 28px/1 var(--display);margin:0;text-transform:uppercase}
h3{font:600 17px/1.25 var(--body);margin:0}
.sec-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:800 italic 22px/1 var(--display);text-transform:uppercase;margin:28px 0 12px;color:var(--text)}
.sec-t .lnk{font:600 14px var(--body);text-transform:none;color:var(--c);background:none;border:0;padding:0}
.mut{color:var(--mut)} .sm{font-size:14px} .xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.link{background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.gap12{height:12px}

.btn{border:0;border-radius:10px;padding:14px 20px;font:800 italic 20px/1 var(--display);text-transform:uppercase;letter-spacing:.4px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.hot{background:var(--c);color:var(--c-ink)}
.btn.cool{background:var(--text);color:#111}
.btn.ghost{background:var(--s2);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid rgba(255,77,94,.5);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:10px 14px;font-size:16px;border-radius:9px}
.btn:active{transform:scale(.97)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:8px 14px;font:700 15px var(--display);text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
.chip.on{color:var(--c-ink);border-color:transparent;background:var(--c)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border-bottom:1px solid var(--line);min-width:0;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
@media (max-width:420px){.seg button{font-size:15px;padding:12px 2px}}
.seg button{border:0;background:none;padding:12px 6px;font:800 italic 18px var(--display);text-transform:uppercase;color:var(--dim);position:relative}
.seg button.on{color:var(--text)}
.seg button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:3px;background:var(--c)}

/* ---- Hoy ---- */
.hello{margin:16px 0 12px}
.hero{position:relative;overflow:hidden;margin:0 -16px;background:var(--c);color:var(--c-ink);min-height:300px}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-62deg,transparent 0 22px,rgba(0,0,0,.06) 22px 44px);pointer-events:none}
.hero .stage{position:absolute;inset:0}
.hero .stage canvas{width:100%!important;height:100%!important;display:block}
.hero .fallback{display:none}
.hero .copy{position:relative;z-index:2;padding:16px 16px 18px;pointer-events:none;display:flex;flex-direction:column;min-height:300px}
.hero .copy>*{pointer-events:auto}
.rtabs{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;margin-bottom:18px}
.rtabs::-webkit-scrollbar{display:none}
.rtabs button{flex:none;border:0;background:none;padding:2px 0;font:700 15px var(--display);text-transform:uppercase;letter-spacing:.5px;color:inherit;opacity:.55;border-bottom:2px solid transparent}
.rtabs button.on{opacity:1;border-bottom-color:currentColor}
.hero .kicker{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.6px;opacity:.75;max-width:62%}
.hero .day{font:900 italic 64px/.86 var(--display);text-transform:uppercase;letter-spacing:-.5px;margin:6px 0 10px;max-width:66%}
.hero .meta{font:700 16px var(--display);text-transform:uppercase;letter-spacing:.6px;opacity:.8}
.hero .acts{margin-top:auto;padding-top:18px;display:flex;gap:8px;align-items:center}
.hero .acts .btn.hot{flex:1;background:var(--c-ink);color:var(--c)}
.hero .acts .icon-btn{background:transparent;border:2px solid currentColor;color:inherit;width:48px;height:48px}

.weekhead{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.weekhead b{font:800 italic 22px var(--display);text-transform:uppercase}
.weekhead span{font:700 16px var(--display);text-transform:uppercase;color:var(--mut);letter-spacing:.4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wday{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;color:var(--dim);font:700 14px var(--display);min-width:0}
.wday b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--display);color:var(--mut);border:2px solid var(--line)}
.wday.plan b{border-color:var(--dc);color:var(--text)}
.wday.done b{background:var(--dc);border-color:var(--dc);color:var(--dci)}
.wday.today{color:var(--text)}
.wday.today b{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.wday i{display:none}
.strip{display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.strip div{padding:14px 4px 12px}
.strip div+div{border-left:1px solid var(--line);padding-left:14px}
.strip b{display:block;font:800 italic 34px/1 var(--display)}
.strip span{font-size:13px;color:var(--mut)}

.plan{list-style:none;margin:0;padding:0;counter-reset:ej}
.plan li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan.num li::before{counter-increment:ej;content:counter(ej,decimal-leading-zero);font:800 italic 20px var(--display);color:var(--c);width:30px;flex:none}
.plan li .link{flex:1;min-width:0}
.plan.num li{display:grid;grid-template-columns:34px 1fr;gap:4px 0;align-items:start}
.plan.num li::before{grid-row:span 2;padding-top:1px}
.plan.num .pills{justify-content:flex-start}
.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.pill{font:700 15px var(--display);padding:2px 7px;border-radius:5px;background:var(--s2);color:var(--text);white-space:nowrap}
.pill.t-w{color:var(--warm)}
.pill.t-d{color:var(--drop)}
.pill.t-f{color:var(--bad)}

.goal{display:flex;gap:14px;align-items:center}
.gring{width:70px;height:70px;flex:none;position:relative}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring circle{fill:none;stroke-width:8}
.gring .tr{stroke:var(--s2)}
.gring .fg{stroke:var(--c)}
.gring span{position:absolute;inset:0;display:grid;place-items:center;font:800 italic 20px var(--display)}
.streak{display:inline-block;font:700 15px var(--display);text-transform:uppercase;color:var(--c);margin-top:4px}

.mus{display:grid;grid-template-columns:92px 1fr 30px;gap:10px;align-items:center;font-size:14px}
.mus .bar{height:12px;border-radius:2px;background:var(--s2);position:relative;overflow:hidden}
.mus .bar .zone{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.07);border-left:1px solid rgba(255,255,255,.25);border-right:1px solid rgba(255,255,255,.25)}
.mus .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--mut)}
.mus .bar i.ok{background:var(--c)}
.mus .bar i.hi{background:var(--warm)}
.mus .bar i.ghost{background:var(--text);height:2px;top:auto;bottom:0;opacity:.6}
.mus b{text-align:right;font:800 italic 18px var(--display)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:14px 4px 12px;background:none!important;border:0!important;border-radius:0!important}
.stat+.stat{border-left:1px solid var(--line)!important;padding-left:12px}
.stat b{display:block;font:800 italic 30px/1 var(--display)}
.stat span{font-size:13px;color:var(--mut)}

/* ---- Entreno ---- */
.wbar{position:sticky;top:calc(61px + env(safe-area-inset-top));z-index:15;margin:0 -16px 14px;padding:12px 16px 12px;background:var(--c);color:var(--c-ink)}
.wbar-top{display:flex;align-items:flex-end;gap:10px}
.wbar h2{font-size:30px;color:inherit}
.clock{font:800 italic 30px/1 var(--display);font-variant-numeric:tabular-nums}
.wprog{height:4px;background:rgba(0,0,0,.18);margin:10px 0;overflow:hidden}
.wprog i{display:block;height:100%;background:var(--c-ink);transition:width .4s}
.exchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.exchips::-webkit-scrollbar{display:none}
.exchip{flex:none;max-width:150px;border:1.5px solid rgba(0,0,0,.25);background:transparent;border-radius:7px;padding:5px 9px;font:700 14px var(--display);text-transform:uppercase;color:inherit;text-align:left;display:flex;align-items:center;gap:6px;opacity:.7}
.exchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exchip small{font:800 13px var(--display)}
.exchip.on{background:var(--c-ink);color:var(--c);border-color:var(--c-ink);opacity:1}
.exchip.full:not(.on){opacity:1;text-decoration:line-through}
.wbar .seg{border:1.5px solid rgba(0,0,0,.25);border-radius:7px;overflow:hidden}
.wbar .seg button{color:inherit;opacity:.6;font-size:14px;padding:5px 9px}
.wbar .seg button.on{opacity:1;background:var(--c-ink);color:var(--c)}
.wbar .seg button.on::after{display:none}
.badge-edit{display:inline-block;font:700 14px var(--display);text-transform:uppercase;letter-spacing:.4px;opacity:.75}
.ex{padding:16px 14px 12px}
.ex-list .ex+.ex{margin-top:12px}
.ex-h{display:flex;gap:8px;align-items:flex-start}
.ex-h h3{font:800 italic 28px/1 var(--display);text-transform:uppercase}
.ex .meta{font-size:14px;color:var(--mut);margin-top:5px}
.note{font-size:14px;color:var(--c);margin:8px 0 2px}
.hint{font-size:14px;color:var(--text);border-left:3px solid var(--c);background:var(--s2);padding:8px 10px;margin:10px 0 4px}
.set{display:grid;grid-template-columns:44px 1fr 14px 1fr 52px;align-items:center;gap:7px;padding:6px 0;margin-top:4px;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set input{width:100%;height:52px;border-radius:9px;border:1px solid var(--line);background:var(--bg);text-align:center;font:700 26px var(--display);outline:none;font-variant-numeric:tabular-nums}
.set input:focus{border-color:var(--c)}
.set .x{color:var(--dim);text-align:center}
.set .sub{grid-column:2/5;font-size:13px;color:var(--dim);margin-top:-1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .sub b{color:var(--mut);font-weight:600}
.ty{height:52px;border-radius:9px;border:1px solid var(--line);background:var(--s2);font:800 italic 22px var(--display);color:var(--mut);display:grid;place-items:center;padding:0}
.ty.sm{height:40px;width:40px;font-size:18px;border-radius:8px}
.ty.t-w{color:var(--warm);border-color:var(--warm)}
.ty.t-d{color:var(--drop);border-color:var(--drop)}
.ty.t-f{color:var(--bad);border-color:var(--bad)}
.chk{height:52px;border-radius:9px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.chk svg{width:24px;height:24px;opacity:.35}
.set.done .chk{background:var(--c);border-color:var(--c);transform:rotate(-8deg) scale(1.04)}
.set.done .chk svg{opacity:1;stroke:var(--c-ink)}
.set.done input{border-color:transparent;background:var(--s2);color:var(--mut)}
.ex-tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--s2);border-radius:8px;padding:7px 11px;font-size:14px;font-weight:600;color:var(--mut)}
.mini.ic{width:34px;height:34px;padding:0;display:grid;place-items:center;flex:none}
.mini svg{width:16px;height:16px}
.fnav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:12px}
.fnav .btn{min-width:0}
.fnav .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{font-size:13px;color:var(--dim);margin:14px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.legend i{width:20px;height:20px;border-radius:5px;display:inline-grid;place-items:center;font:800 italic 13px var(--display);font-style:normal;margin-right:4px;vertical-align:-5px}
details.more{margin-top:8px}
details.more summary{cursor:pointer;list-style:none;font:700 17px var(--display);text-transform:uppercase;letter-spacing:.4px;color:var(--mut);padding:12px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}

select.field,input.field,textarea.field{width:100%;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:13px 14px;font-size:16px;outline:none}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select.field option,select.field optgroup{background:var(--s1)}
.field:focus{border-color:var(--c)}
textarea.field{min-height:76px;resize:vertical}
.flabel{display:block;font-size:13.5px;color:var(--mut);margin:0 0 6px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.timer{position:fixed;z-index:40;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));padding:10px 16px;background:var(--c);color:var(--c-ink);display:flex;align-items:center;gap:12px;transition:transform .3s}
.timer.hidden{transform:translateY(120%);pointer-events:none;visibility:hidden;transition:transform .3s,visibility 0s .3s}
.ring{width:46px;height:46px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .tr{stroke:rgba(0,0,0,.18)}
.ring .fg{stroke:var(--c-ink);transition:stroke-dashoffset .5s linear}
.timer .xs{color:inherit!important;opacity:.7;font:700 13px var(--display);text-transform:uppercase;letter-spacing:.5px}
.timer .tt{font:800 italic 36px/1 var(--display);font-variant-numeric:tabular-nums}
.timer .mini{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.2);color:inherit;font:700 16px var(--display);text-transform:uppercase}
.timer.fin{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}

/* ---- Historial ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .dw{font:700 13px var(--display);color:var(--dim);padding-bottom:4px}
.cal button{aspect-ratio:1;border:0;border-radius:8px;background:var(--s2);font:700 17px var(--display);color:var(--mut);padding:0}
.cal button.out{opacity:.25}
.cal button.has{background:var(--c);color:var(--c-ink)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--text)}
.cal button.sel{outline:2px solid var(--text);outline-offset:2px}
.cal button.fut{opacity:.4}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calhead h3{flex:1;text-align:center;font:800 italic 24px var(--display);text-transform:uppercase}
.list-i{padding:14px}
.list-i+.list-i{margin-top:8px}
.list-i.tap{cursor:pointer}
.list-i h3{font:800 italic 22px/1.05 var(--display);text-transform:uppercase}
.badge{font:700 16px var(--display);padding:3px 8px;border-radius:6px;background:var(--s2);color:var(--text);white-space:nowrap}
.det{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px}
.det p{margin:0 0 8px}
.tl{font:800 italic 13px var(--display)}
.tl.t-w{color:var(--warm)} .tl.t-d{color:var(--drop)} .tl.t-f{color:var(--bad)}

/* ---- Progreso ---- */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--dim);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--line)}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rec{padding:14px}
.rec b{display:block;font:800 italic 30px/1.05 var(--display)}
.rec span{font-size:13px;color:var(--mut)}
.toprec{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;color:inherit}
.toprec:first-of-type{border-top:0}
.toprec em{font:800 italic 20px var(--display);color:var(--c);font-style:italic}
.toprec b{font:800 italic 20px var(--display)}

/* ---- Rutinas ---- */
.day-card{padding:0 14px 14px;overflow:hidden}
.day-card+.day-card{margin-top:14px}
.day-card>.row:first-child{background:var(--dc);color:var(--dci);padding:12px 14px;margin:0 -14px}
.day-card>.row:first-child .mini{background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.2);color:inherit}
.day-name{font:800 italic 22px var(--display);text-transform:uppercase;background:transparent;border:0;border-bottom:1.5px dashed rgba(0,0,0,.35);padding:2px 0;width:100%;outline:none;color:inherit}

<script>
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const hm = d => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
const today = () => iso(new Date());
const dt = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addDays = (s, n) => { const d = dt(s); d.setDate(d.getDate() + n); return iso(d); };
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const e1rm = (p, r) => (p && r) ? (r === 1 ? p : p * (1 + r / 30)) : 0;
const kg = n => (Math.round((n || 0) * 100) / 100).toLocaleString('es-ES');
const big = n => n >= 10000 ? (Math.round(n / 100) / 10).toLocaleString('es-ES') + 'k' : Math.round(n).toLocaleString('es-ES');
const fDate = s => dt(s).toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
const fShort = s => dt(s).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' });
const mmss = s => Math.floor(s / 60) + ':' + pad2(Math.max(0, s % 60));
const fDur = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + ':' + pad2(m) + ':' + pad2(s % 60) : m + ':' + pad2(s % 60); };
const rid = () => Math.random().toString(36).slice(2, 10);
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const store = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const errMsg = e => (e && (e.message || e)) + '';
const topReps = r => { const m = String(r ?? '').match(/(\d+)\s*$/); return m ? +m[1] : null; };
const weekStart = s => { const d = dt(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const clone = o => JSON.parse(JSON.stringify(o));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const TIPOS = ['n', 'w', 'd', 'f'];
const TNAME = { n: 'Normal', w: 'Calentamiento', d: 'Drop set', f: 'Al fallo' };
const TLET = { w: 'C', d: 'D', f: 'F' };
const nextTipo = t => TIPOS[(TIPOS.indexOf(t || 'n') + 1) % TIPOS.length];
const tyLabel = (t, n) => TLET[t] || String(n);
const setTxt = s => (s.peso ? kg(s.peso) + '×' : '') + (s.reps ?? '') + (TLET[s.tipo] ? ' <span class="tl t-' + s.tipo + '">' + TLET[s.tipo] + '</span>' : '');
const WD = [[1, 'L'], [2, 'M'], [3, 'X'], [4, 'J'], [5, 'V'], [6, 'S'], [0, 'D']];

/* ================= Entrenador: progresión de peso y reps ================= */
const ISO_RX = /curl|extensi|elevaci|apertura|contractor|cruce|pec ?deck|femoral|gemelo|lateral|face ?pull|patada|pullover|abduc|aduc|encogim|antebrazo|muñeca|posterior|crunch|rueda|plancha|vuelos/i;

}

}
function incOf(ejId) {

  const ws = [...new Set((S.ix.hist[ejId] || []).flatMap(h => h.sets).map(s => +s.peso).filter(p => p > 0))].sort((a, b) => a - b);
  let st = Infinity; for (let i = 1; i < ws.length; i++) { const d = Math.round((ws[i] - ws[i - 1]) * 100) / 100; if (d >= 1 && d < st) st = d; }

    if (pw.some(p => p.peso)) {
      const pesos = [], reps = [];
      for (let k = 0; k < nWork; k++) { const p = pw[k] || pw[pw.length - 1]; pesos.push(+p.peso || 0); reps.push(rg(k)[1]); }

      const p = roundW(bw * st.v * lvl * sexF() / (1 + (hi0 + 2) / 30), inc);
      if (p > 0) return { kind: 'new', lo: lo0, hi: hi0, inc, pesos: Array(nWork).fill(p), reps: Array(nWork).fill(hi0), lines: [], msg: `Primera vez: empieza con ${kg(p)} kg y haz ${hi0} reps. Es una estimación por tu nivel; si te sobran más de 3 reps, sube ${kg(inc)} kg en la siguiente serie.`, tip };
    }

const W0 = a => Math.max(0, ...a.map(x => +x || 0));

/* ---------- Arrastrar para ordenar ---------- */
let DR = null;
document.addEventListener('pointerdown', ev => {
  const h = ev.target.closest('[data-handle]'); if (!h || !S.rd) return;
  const row = h.closest('.edrow'), list = row.parentElement, rows = [...list.querySelectorAll(':scope > .edrow')];
  if (rows.length < 2) return;
  ev.preventDefault();
  try { h.setPointerCapture(ev.pointerId); } catch (e) {}
  const sy = window.scrollY, rects = rows.map(r => { const b = r.getBoundingClientRect(); return { top: b.top + sy, h: b.height }; });
  const from = rows.indexOf(row), gap = rows.length > 1 ? Math.max(0, rects[1].top - rects[0].top - rects[0].h) : 0;
  DR = { h, row, rows, rects, from, to: from, y0: ev.clientY + sy, y: ev.clientY, i: +list.dataset.i, gap, raf: 0 };
  row.classList.add('dragging'); list.classList.add('sorting');
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
  const loop = () => { if (!DR) return; const m = 70, vh = window.innerHeight - (window.innerWidth < 900 ? 70 : 0); if (DR.y < m) window.scrollBy(0, -Math.ceil((m - DR.y) / 6)); else if (DR.y > vh - m) window.scrollBy(0, Math.ceil((DR.y - vh + m) / 6)); dragMove(); DR.raf = requestAnimationFrame(loop); };
  DR.raf = requestAnimationFrame(loop);
});
function dragMove() {
  const d = DR; const py = d.y + window.scrollY, dy = py - d.y0;
  d.row.style.transform = `translateY(${dy}px)`;
  const me = d.rects[d.from], center = me.top + dy + me.h / 2, step = me.h + d.gap;
  let to = 0; d.rects.forEach((r, k) => { if (k !== d.from && center > r.top + r.h / 2) to++; });
  d.to = to;
  d.rows.forEach((r, k) => { if (k === d.from) return; let s = 0; if (d.from < to && k > d.from && k <= to) s = -step; if (d.from > to && k >= to && k < d.from) s = step; r.style.transform = s ? `translateY(${s}px)` : ''; });
}
document.addEventListener('pointermove', ev => { if (!DR) return; ev.preventDefault(); DR.y = ev.clientY; }, { passive: false });
function dragEnd() {
  if (!DR) return; const d = DR; DR = null; cancelAnimationFrame(d.raf);
  d.rows.forEach(r => r.style.transform = ''); d.row.classList.remove('dragging');
  if (d.to !== d.from) { const it = S.rd.dias[d.i].items; const [m] = it.splice(d.from, 1); it.splice(d.to, 0, m); dirty(); }
  render();
}
document.addEventListener('pointerup', dragEnd);
document.addEventListener('pointercancel', dragEnd);
document.addEventListener('touchmove', ev => { if (DR) ev.preventDefault(); }, { passive: false });

const PLATE_COL = { 25: '#ff3b5c', 20: '#2f7bff', 15: '#ffc93d', 10: '#2fbf71', 5: '#f4f1ff', 2.5: '#ff5a36', 1.25: '#a59fc9', 0.5: '#6f6898' };
function platesFor(total, bar, discos) {
  let side = (total - bar) / 2; const out = [];
  discos.forEach(d => { while (side >= d - 1e-9) { out.push(d); side = Math.round((side - d) * 1000) / 1000; } });
  return { out, rest: side * 2 };
}

function tools(peso) {

  sheet(`<h2>Herramientas</h2>

    ${toolTab === 'discos' ? `

function toolCalc() {
  const a = AJ();

    const t = num($('#tp_peso').value) || 0, b = num($('#tp_barra').value) || 0;
    const ds = a.discos.split(',').map(num).filter(Boolean).sort((x, y) => y - x);

  }

      const h = $('#hero'); if (h && matchMedia('(hover:hover)').matches) { const b = h.getBoundingClientRect(); const px = (e.clientX - b.left) / b.width - .5, py = (e.clientY - b.top) / b.height - .5; if (Math.abs(px) < .7 && Math.abs(py) < .7) h.style.transform = `perspective(900px) rotateX(${-py * 4}deg) rotateY(${px * 6}deg)`; else h.style.transform = ''; }
    });
    window.addEventListener('deviceorientation', e => { if (e.gamma == null) return; G3.tx = Math.max(-1, Math.min(1, e.gamma / 35)); G3.ty = Math.max(-1, Math.min(1, (e.beta - 45) / 35)); });
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let t0 = performance.now();
    const loop = now => {
      requestAnimationFrame(loop);
      const host = $('#hero3d');
      if (!host || document.hidden) return;
      const dtm = Math.min(50, now - t0); t0 = now;
      if (!reduce) { G3.g.rotation.y += G3.vy * dtm / 16; G3.g.rotation.x += G3.vx * dtm / 16; }
      G3.vy += (.006 - G3.vy) * .02; G3.vx *= .94;
      G3.g.rotation.x += ((.3 + G3.ty * .3) - G3.g.rotation.x) * .03;
      G3.g.position.x = G3.bx + G3.tx * .2;
      G3.g.position.y = G3.by + Math.sin(now / 900) * .08;
      G3.l1.position.x = -2 + Math.sin(now / 1500) * 2; G3.l2.position.y = -2 + Math.cos(now / 1300) * 2;
      G3.r.render(G3.scene, G3.cam);
    };
    requestAnimationFrame(loop);
    return true;
  } catch (e) { console.warn('3D desactivado', e); return false; }
}
function mount3D() {
  const host = $('#hero3d'); if (!host) return;
  if (!init3D()) { host.innerHTML = '<div class="fallback"></div>'; return; }
  host.appendChild(G3.r.domElement);
  const size = () => { const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return; G3.r.setSize(w, h, false); G3.cam.aspect = w / h; G3.cam.updateProjectionMatrix();
    const halfH = G3.cam.position.z * Math.tan(16 * Math.PI / 180), halfW = halfH * w / h;
    G3.bx = halfW * .66; G3.by = halfH * .3; G3.g.scale.setScalar(Math.min(.85, Math.max(.45, halfH * .26))); };
  size(); requestAnimationFrame(size);
}
window.addEventListener('resize', () => mount3D());

/* ================= Arranque ================= */

function loginScreen(msg) {
  document.body.classList.add('login');
  $('#main').innerHTML = `<div class="loginbox">
    <img src="apple-touch-icon.png" alt="" width="96" height="96">
    <h1>Magma</h1>
    <p>Tu cuaderno de gimnasio con rangos por músculo y un entrenador que te dice qué peso toca.</p>
    <button class="gbtn" data-a="glogin"><svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continuar con Google</button>
    ${msg ? `<p class="xs" style="color:#ff8a8a">${esc(msg)}</p>` : ''}
    <p class="xs mut">Tus entrenos se guardan en una hoja "Magma · datos" de tu propio Google Drive. Magma solo puede abrir esa hoja.</p>
  </div>`;
}

(async function boot() {
  if (MODE === 'g' && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
  if (MODE === 'g') {
    const r = G.fromHash();
    const v = load('magma_view'); if (v) { S.view = v; store('magma_view', null); }
    if (r && r !== 'ok') { if (['interaction_required', 'login_required', 'consent_required', 'account_selection_required'].includes(r)) { store('magma_in', null); return loginScreen(); } return loginScreen(r === 'noscope' ? 'Para guardar tus entrenos, deja marcada la casilla de Google Drive al iniciar sesión.' : r === 'access_denied' ? 'Necesito tu permiso para guardar tus datos en tu Google Drive.' : 'No se pudo iniciar sesión. Vuelve a intentarlo.'); }
    if (!G.tok()) { if (load('magma_in')) return G.login(true); return loginScreen(); }
    if (r === 'ok' && !load('magma_email')) G.email();
    const c = load('magma_data'); if (c) { try { setData(clone(c)); } catch (e) {} }
  }
  if (S.w && !S.w.past) wake(true);
  if (MODE === 'api') { const c = load('magma_data'); if (c) { try { setData(applyQueue(clone(c))); } catch (e) {} } }
  try { setData(await api('getData')); }
  catch (e) {
    if (MODE === 'g' && e.auth) return G.login(true);
    if (MODE === 'g' && e.net && S.data) { S.offline = true; render(); return; }
    if (S.data) { render(); toast(errMsg(e), true); }
    else $('#main').innerHTML = `<div class="glass pad empty"><h2>No se pudieron cargar tus datos</h2><p class="mut">${esc(errMsg(e))}</p><button class="btn hot" onclick="location.reload()">Reintentar</button>${MODE === 'api' ? '<div class="gap12"></div><button class="btn ghost sm" data-a="disconnect">Cambiar la conexión</button>' : ''}</div>`;
  }
  if (MODE === 'api') { try { const r = await fetch(CFG.url + '?archivo=app'); const t = await r.text(); if (t.indexOf('<html') >= 0 && t !== localStorage.getItem('magma_app')) { localStorage.setItem('magma_app', t); toast('Magma se ha actualizado: verás las novedades al volver a abrirla'); } } catch (e) {} }
})();
</script>
